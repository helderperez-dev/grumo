name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release-dry-run.yml"

permissions:
  contents: read

jobs:
  dry-run:
    name: Build and validate without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --python 3.12 --all-extras --dev
      - name: Full tests
        run: uv run --python 3.12 pytest -q
      - name: Full type ratchet
        run: uv run --python 3.12 python scripts/check_mypy_ratchet.py
      - name: Documentation imports
        run: uv run --python 3.12 python scripts/check_docs_imports.py
      - name: Durable migration corpus
        run: uv run --python 3.12 python scripts/check_migration_corpus.py
      - name: Build wheel and source distribution
        run: uv build --out-dir /tmp/grumo-release-dry-run
      - name: Verify release artifacts
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("/tmp/grumo-release-dry-run")
          artifacts = []
          for path in sorted(root.iterdir()):
              artifacts.append({
                  "file": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              })
          (root / "release-manifest.json").write_text(json.dumps({"artifacts": artifacts}) + "\n")
          for item in artifacts:
              path = root / item["file"]
              assert path.stat().st_size == item["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
          print(f"verified {len(artifacts)} release artifacts")
          PY

      - name: Build release artifacts
        run: |
          uv build --out-dir /tmp/grumo-release-dry-run
          if tar -tzf /tmp/grumo-release-dry-run/*.tar.gz | grep -E '(__pycache__/|\.py[cod]$)'; then
            echo "source distribution contains generated interpreter bytecode" >&2
            exit 1
          fi

      - name: Clean-install scaffold lifecycle
        run: |
          uv venv --python 3.12 /tmp/grumo-release-env
          uv pip install --python /tmp/grumo-release-env/bin/python /tmp/grumo-release-dry-run/*.whl
          cd /tmp
          /tmp/grumo-release-env/bin/grumo new grumo-release-smoke-app --no-install
          cd grumo-release-smoke-app
          /tmp/grumo-release-env/bin/python -m compileall -q app

      - name: Verify canonical Grumo wheel
        run: |
          /tmp/grumo-release-env/bin/python - <<'PY'
          import importlib.metadata
          import grumo
          import importlib.util
          from grumo.cli import app as grumo_app

          assert importlib.metadata.version("grumo") == grumo.__version__
          import grumo_store
          assert importlib.metadata.version("grumo-store") == grumo_store.__version__
          for legacy in ("voodoo-framework", "voodoo-store"):
              try:
                  importlib.metadata.version(legacy)
              except importlib.metadata.PackageNotFoundError:
                  pass
              else:
                  raise AssertionError(f"Unexpected legacy distribution: {legacy}")
          assert importlib.util.find_spec('voodoo') is None
          assert importlib.util.find_spec('voodoo_store') is None
          print("verified canonical Grumo namespace in installed wheel")
          PY
          /tmp/grumo-release-env/bin/grumo --help

      - name: Clean-install exact source distribution
        run: |
          uv venv --python 3.12 /tmp/grumo-release-sdist-env
          uv pip install --python /tmp/grumo-release-sdist-env/bin/python /tmp/grumo-release-dry-run/*.tar.gz
          /tmp/grumo-release-sdist-env/bin/python - <<'PY'
          import importlib.metadata
          import subprocess
          import grumo
          import grumo

          version = importlib.metadata.version("grumo")
          assert version == grumo.__version__
          for cli in ("grumo",):
              result = subprocess.run(
                  [f"/tmp/grumo-release-sdist-env/bin/{cli}", "version"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              assert result.returncode == 0, result.stderr
              assert version in result.stdout, result.stdout
          print(f"verified exact source distribution {version}")
          PY
