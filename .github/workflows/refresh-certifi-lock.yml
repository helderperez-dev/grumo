name: Refresh vulnerable certifi lockfile

on:
  push:
    branches: [feat/grumo-cli-transition]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grumo-certifi-lock
  cancel-in-progress: false

jobs:
  update-certifi:
    runs-on: ubuntu-latest
    if: github.repository == 'helderperez-dev/voodoo'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/grumo-cli-transition
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Resolve patched certifi with verified registry hashes
        run: |
          uv lock --upgrade-package certifi
          python - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("uv.lock").read_text())
          versions = [p["version"] for p in lock["package"] if p["name"] == "certifi"]
          assert len(versions) == 1, versions
          assert tuple(map(int, versions[0].split("."))) >= (2026, 10, 18), versions
          print(f"Locked fixed certifi version {versions[0]}")
          PY
      - name: Commit patched resolved lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "Already secure; no lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "security(lock): upgrade certifi to patched release"
          git push origin HEAD:feat/grumo-cli-transition
