name: One-time Grumo transition formatting

on:
  push:
    branches: [feat/grumo-cli-transition]
    paths:
      - .github/workflows/format-grumo-transition.yml

permissions:
  contents: write

jobs:
  format-changed-python:
    if: github.repository == 'helderperez-dev/voodoo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/grumo-cli-transition
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Apply the pinned formatter to only touched Python files
        run: |
          uvx ruff==0.16.3 check --fix scripts/check_visual_contract.py
          uvx ruff==0.16.3 format             scripts/check_migration_corpus.py             scripts/check_visual_contract.py             src/voodoo/mesh/client.py             src/voodoo/runtime/workflow_store.py             tests/browser/test_component_lab_browser.py             tests/unit/cli/test_grumo_transition.py
          python -m compileall -q scripts/check_migration_corpus.py scripts/check_visual_contract.py src/voodoo/mesh/client.py src/voodoo/runtime/workflow_store.py
          uvx ruff==0.16.3 check .
      - name: Commit only validated formatting changes
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_migration_corpus.py scripts/check_visual_contract.py src/voodoo/mesh/client.py src/voodoo/runtime/workflow_store.py tests/browser/test_component_lab_browser.py tests/unit/cli/test_grumo_transition.py
          git commit -m "style: format Grumo transition Python files with Ruff"
          git push origin HEAD:feat/grumo-cli-transition
