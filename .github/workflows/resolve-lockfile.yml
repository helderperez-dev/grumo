name: Prepare migration formatting

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'grumo/native-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12 --all-extras --dev
      - name: Format Python sources
        run: |
          uv run --locked --python 3.12 ruff format .
          uv run --locked --python 3.12 ruff format --check .
      - name: Capture formatting-only changes
        run: |
          git diff --binary -- '*.py' > /tmp/grumo-format.patch
          git diff --stat
          python - <<'PY'
          import base64, json, subprocess
          from pathlib import Path
          names = subprocess.check_output(["git", "diff", "--name-only", "-z", "--", "*.py"]).decode().split("\0")
          for name in filter(None, names):
              data = base64.b64encode(Path(name).read_bytes()).decode("ascii")
              for offset in range(0, len(data), 4096):
                  print("FORMAT_CHUNK:" + json.dumps([name, offset, data[offset:offset + 4096]], separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grumo-format-patch
          path: /tmp/grumo-format.patch
          if-no-files-found: error
