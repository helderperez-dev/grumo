name: Published installation smoke tests
on:
  pull_request:
    paths:
      - ".github/workflows/published-install.yml"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uv-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Install published CLI
        shell: bash
        run: |
          uv tool install --python 3.12 grumo==2.0.1
          uv tool run --from grumo==2.0.1 --python 3.12 grumo version
          uv tool run --from grumo==2.0.1 --python 3.12 grumo new smoke-app --no-install
          test -f smoke-app/pyproject.toml
      - name: Verify isolated tool and project dependency
        shell: bash
        run: |
          uv init --bare --python 3.12 smoke-project
          cd smoke-project
          uv add 'grumo==2.0.1'
          uv run grumo --help
          uv run python -c 'import grumo, grumo_store; from importlib.metadata import version; assert grumo.__version__ == version("grumo") == "2.0.1"; assert grumo_store.__version__ == version("grumo-store"); assert grumo_store.__version__.split(".")[0] == "2"'
          uv tool uninstall grumo
