[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grumo"
dynamic = ["version"]
description = "The programmable runtime for adaptive applications and operational systems — from web and AI to distributed and physical systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Helder Perez", email = "contact@helderperez.com" },
]
maintainers = [
    { name = "Helder Perez", email = "contact@helderperez.com" },
]
keywords = [
    "python",
    "runtime",
    "application-runtime",
    "distributed-systems",
    "ai-agents",
    "edge-computing",
    "reactive-ui",
    "durable-execution",
    "operational-systems",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "starlette",
    "uvicorn",
    "pydantic",
    "grumo-store>=2.0.0,<3.0.0",
    "websockets",
    "httpx",
    "python-dotenv",
    "pyyaml",
    "typer",
    "rich",
    "aiofiles"
]

[project.urls]
Homepage = "https://github.com/helderperez-dev/grumo"
Documentation = "https://github.com/helderperez-dev/grumo#documentation"
Repository = "https://github.com/helderperez-dev/grumo"
Changelog = "https://github.com/helderperez-dev/grumo/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/helderperez-dev/grumo/blob/main/ROADMAP.md"
Issues = "https://github.com/helderperez-dev/grumo/issues"
Discussions = "https://github.com/helderperez-dev/grumo/discussions"

[project.scripts]
grumo = "grumo.cli:app"

[project.optional-dependencies]
ai = [
    "openai",
    "anthropic",
    "google-generativeai",
    "ollama"
]
mcp = []
browser = [
    "playwright",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-PyYAML",
    "cryptography>=42",
    "pip-audit",
    "pre-commit",
    "aiosqlite",
]
sqlite = [
    "aiosqlite",
]
postgres = [
    "psycopg[binary]>=3.3.4",
]
s3 = [
    "boto3>=1.34",
    "botocore>=1.34",
]
redis = [
    "redis>=5.0",
]
edge = [
    "paho-mqtt>=2.0",
]
secrets = [
    "cryptography>=42",
]

[tool.setuptools.dynamic]
version = { attr = "grumo.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["grumo*"]

[tool.setuptools.package-data]
grumo = [
    "py.typed",
    "static/*.js",
    "*.html",
    "*.css",
    "scaffold/default/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long — handled by ruff format; unavoidable in embedded HTML/JS strings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Optional provider extras are tested in their own CI jobs. Keep the base
# framework type-checkable when those integrations are intentionally absent.
[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "boto3.*",
    "botocore.*",
    "redis.*",
    "ollama.*",
    "anthropic.*",
    "google.*",
    "paho.*",
    "yaml.*",
]
ignore_missing_imports = true
